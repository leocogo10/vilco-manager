<style>
#root{visibility:hidden}
#vilco-gate[hidden],#vilco-sync-pill[hidden],#vilco-logout-btn[hidden]{display:none!important}
#vilco-gate{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:24px;background:#0a0a0a;color:#f5f5f0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.vilco-gate-card{width:min(100%,420px);padding:34px;border:1px solid #262521;border-radius:18px;background:#11110f;box-shadow:0 24px 90px rgba(0,0,0,.45)}
.vilco-gate-mark{width:48px;height:48px;display:grid;place-items:center;border:1px solid #c9a86e;color:#c9a86e;font-family:Georgia,serif;font-size:25px}
.vilco-gate-card h1{margin:22px 0 8px;font-family:"Playfair Display",Georgia,serif;font-size:30px;font-weight:500}
.vilco-gate-card p{margin:0;color:#a4a39c;line-height:1.55;font-size:14px}
.vilco-gate-card label{display:block;margin:22px 0 8px;color:#aaa99f;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
#vilco-gate-password{width:100%;height:46px;padding:0 13px;border:1px solid #37352e;border-radius:9px;outline:none;background:#0c0c0b;color:#f5f5f0;font-size:15px}
#vilco-gate-password:focus{border-color:#c9a86e}
#vilco-gate-form button{width:100%;height:46px;margin-top:13px;border:1px solid #c9a86e;border-radius:9px;background:#c9a86e;color:#111;font-weight:750}
#vilco-gate-form button:disabled{opacity:.65}
#vilco-gate-message{min-height:22px;margin-top:12px;color:#a4a39c;font-size:12px;line-height:1.5}
#vilco-gate-message.is-error{color:#e1a19a}
#vilco-sync-pill{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:1000;max-width:calc(100vw - 24px);padding:9px 13px;border:1px solid #3a352b;border-radius:999px;background:rgba(17,17,15,.96);color:#d7c296;font:600 11px/1.2 Inter,ui-sans-serif,system-ui,sans-serif;box-shadow:0 5px 22px rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vilco-sync-pill.is-action{cursor:pointer;border-color:#c9a86e;color:#f0dcae}
#vilco-sync-pill:hover{border-color:#c9a86e}
#vilco-logout-btn{position:fixed;right:12px;bottom:calc(55px + env(safe-area-inset-bottom));z-index:1000;padding:8px 11px;border:1px solid #34332f;border-radius:999px;background:#11110f;color:#aaa;font:600 10px/1.2 Inter,ui-sans-serif,system-ui,sans-serif}
#vilco-logout-btn:disabled{opacity:.65}
@media(max-width:480px){.vilco-gate-card{padding:27px 22px}.vilco-gate-card h1{font-size:27px}}
</style>
</head>

  <div id="vilco-gate">

    <p>Espacio de trabajo compartido. Ingresá la contraseña para continuar.</p>
    <label for="vilco-gate-password">Contraseña de acceso</label>
    <input id="vilco-gate-password" type="password" autocomplete="current-password" placeholder="Ingresá tu contraseña" required>

    <div id="vilco-gate-message" role="status">Conectando con tu espacio compartido…</div>
  </form>
</div>

  <div id="root"></div>

  var logoutButton = document.getElementById("vilco-logout-btn");
  var originalSetItem = Storage.prototype.setItem;
  var syncEnabled = false;
  var suspendSync = false;
  var syncTimer = null;
  var syncBusy = false;
  var pendingValue = null;
  var lastSeen = null;

  window.__VILCO_BOOT_READY__ = false;

  function message(text, error) {
    gateMessage.textContent = text || "";
    gateMessage.classList.toggle("is-error", !!error);
  }

  function setSync(text, action) {
    syncPill.textContent = text;
    syncPill.hidden = false;
    syncPill.onclick = action || null;
    syncPill.classList.toggle("is-action", !!action);
  }

  function api(url, options) {

        var error = new Error(data.error || "No se pudo completar la operación.");
        error.status = response.status;
        throw error;
      }
      return data;
    });
  }

  function readLocalState() {
    try {
      var raw = localStorage.getItem(STATE_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (error) { return null; }
  }

  function writeLocalState(state) {
    suspendSync = true;
    try { originalSetItem.call(localStorage, STATE_KEY, JSON.stringify(state)); }
    finally { suspendSync = false; }
  }

  async function uploadBlob(blob, name, type) {
    var prepared = await api("/api/media", {
      method: "POST",
      body: JSON.stringify({ action: "prepare-upload", name: name, type: type || blob.type, size: blob.size })
    });
    var formData = new FormData();
    formData.append("cacheControl", "3600");
    formData.append("", blob, name || "archivo");
    var upload = await fetch(prepared.uploadUrl, { method: "PUT", body: formData });
    if (!upload.ok) throw new Error("No se pudo subir " + (name || "el archivo") + " a la nube.");

      method: "POST",
      body: JSON.stringify({ action: "sign", paths: [prepared.path] })
    });

      item.storagePath = uploaded.storagePath;

    var signedChanged = await signStoredMedia(state);
    return { state: state, migrated: migrated, signedChanged: signedChanged };

      var result = await api("/api/state", { method: "POST", body: JSON.stringify({ state: state }) });
      lastSeen = result.updatedAt || lastSeen;
      setSync("✓ Guardado en la nube");
    } catch (error) {
      if (error.status === 401) { window.location.reload(); return; }
      setSync("⚠ No se pudo sincronizar");
      console.warn("VILCO cloud sync:", error.message);
    } finally {
      syncBusy = false;
      if (pendingValue !== null) {
        var next = pendingValue;
        pendingValue = null;
        scheduleSync(next);
      }

  function scheduleSync(value) {

    setSync("Guardando en la nube…");

      pendingValue = null;

    originalSetItem.call(this, key, value);

  async function applyRemoteState(remote) {
    if (!remote || !remote.state) return;
    try {
      setSync("Cargando cambios de otro dispositivo…");
      var prepared = await prepareState(remote.state);
      writeLocalState(prepared.state);
      lastSeen = remote.updatedAt || lastSeen;
      window.location.reload();
    } catch (error) {
      setSync("⚠ No se pudo cargar la actualización");
      console.warn("VILCO remote refresh:", error.message);
    }
  }

  function watchRemoteChanges() {
    setInterval(function() {
      if (!syncEnabled || syncBusy || pendingValue !== null) return;
      api("/api/state").then(function(remote) {

        setSync("Hay cambios de otro dispositivo · actualizar", function(){ applyRemoteState(remote); });
      }).catch(function(error) {
        if (error.status === 401) setSync("Sesión vencida · recargá para ingresar");

    }, 5000);
  }

    window.__VILCO_BOOT_READY__ = true;

  }

  async function connect() {
    gate.hidden = false;
    message("Conectando con tu espacio compartido…");
    try {
      var remote = await api("/api/state");
      await startApp(remote);
    } catch (error) {
      if (error.status === 401) {
        message("Ingresá la contraseña compartida para abrir VILCO.");
      } else if (error.status === 503) {
        message("La contraseña fue aceptada, pero falta configurar la conexión segura con la nube en Vercel.", true);
      } else {
        message(error.message || "No se pudo conectar. Revisá tu conexión e intentá de nuevo.", true);
      }
      gate.hidden = false;
    }
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();
    var button = form.querySelector("button[type=submit]");
    button.disabled = true;
    button.textContent = "Ingresando…";
    message("Validando contraseña…");
    try {
      await api("/api/login", { method: "POST", body: JSON.stringify({ password: password.value }) });
      password.value = "";
      await connect();
    } catch (error) {
      message(error.message || "No se pudo iniciar sesión.", true);
    } finally {
      button.disabled = false;
      button.textContent = "Entrar a VILCO";
    }
  });

  logoutButton.addEventListener("click", async function() {
    logoutButton.disabled = true;
    logoutButton.textContent = "Guardando…";
    try {
      if (syncTimer) {
        clearTimeout(syncTimer);
        syncTimer = null;
      }
      while (syncBusy) await new Promise(function(resolve){ setTimeout(resolve, 100); });
      var value = pendingValue || localStorage.getItem(STATE_KEY);
      pendingValue = null;
      if (value) await sendState(value);
      while (syncBusy) await new Promise(function(resolve){ setTimeout(resolve, 100); });
      await api("/api/logout", { method: "POST" });
    } catch (error) {
      console.warn("VILCO logout:", error.message);
    }
    window.location.reload();
  });

  connect();
